name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传附件的 Release tag（留空则只构建并产出 workflow 产物）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 运行器默认 cp1252，脚本里打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: 跑单元测试
        run: python -m pytest -q
      - name: 生成图标
        run: python tools/make_icon.py
      - name: 打包托盘版
        run: >
          python -m PyInstaller
          --noconfirm --clean
          --icon packaging/app.ico
          --paths src
          --hidden-import pystray._win32
          --exclude-module matplotlib --exclude-module numpy --exclude-module pandas
          --exclude-module PyQt5 --exclude-module PySide6
          --distpath dist --workpath build --specpath build
          --windowed --onefile --name sicau-net-login build_entry.py
      - name: 打包命令行版
        run: >
          python -m PyInstaller
          --noconfirm --clean
          --icon packaging/app.ico
          --paths src
          --hidden-import pystray._win32
          --exclude-module matplotlib --exclude-module numpy --exclude-module pandas
          --exclude-module PyQt5 --exclude-module PySide6
          --distpath dist --workpath build --specpath build
          --console --onefile --name sicau-net-login-cli cli_entry.py
      - uses: actions/upload-artifact@v7
        with:
          name: sicau-net-login-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "$tag — 川农校园网自动登录（Windows）" --generate-notes
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber dist/sicau-net-login.exe dist/sicau-net-login-cli.exe
