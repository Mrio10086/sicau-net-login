name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传附件的 Release tag（留空则只构建并产出 workflow 产物）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 运行器默认 cp1252，脚本里打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: 跑单元测试
        run: python -m pytest -q
      - name: 生成图标
        run: python tools/make_icon.py
      - name: 打包 exe
        shell: pwsh
        run: |
          # spec 生成在 build/ 下，而 spec 里的相对路径以 spec 所在目录为基准，
          # 所以 icon 和入口脚本必须给绝对路径（和本地 build.ps1 一致）。
          $common = @(
            '--noconfirm', '--clean',
            '--icon', "$env:GITHUB_WORKSPACE/packaging/app.ico",
            '--paths', "$env:GITHUB_WORKSPACE/src",
            '--hidden-import', 'pystray._win32',
            '--exclude-module', 'matplotlib', '--exclude-module', 'numpy',
            '--exclude-module', 'pandas', '--exclude-module', 'PyQt5',
            '--exclude-module', 'PySide6',
            '--distpath', 'dist', '--workpath', 'build', '--specpath', 'build'
          )
          python -m PyInstaller @common --windowed --onefile --name sicau-net-login "$env:GITHUB_WORKSPACE/build_entry.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller @common --console --onefile --name sicau-net-login-cli "$env:GITHUB_WORKSPACE/cli_entry.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist/*.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: sicau-net-login-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "$tag — 川农校园网自动登录（Windows）" --generate-notes
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber dist/sicau-net-login.exe dist/sicau-net-login-cli.exe
